name: (Auto) Build and push image

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  REGISTRY: sgccr.ccs.tencentyun.com
  IMAGE_NAME: exm-app/${{ github.event.repository.name }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify models for Docker build (实体文件、体积)
        run: |
          set -euo pipefail
          sym=$(find models -type l | wc -l)
          if [ "$sym" -ne 0 ]; then
            echo "::error::models/ 含 $sym 个符号链接；构建上下文无法跟随外链，请检查 Git LFS 是否拉取完整。"
            find models -type l -ls | head -50
            exit 1
          fi
          mb=$(du -sm models | cut -f1)
          if [ "$mb" -lt 600 ]; then
            echo "::error::models/ 仅 ${mb}MB（若为 ~1MB 量级多为未执行 Git LFS pull）。请在 checkout 启用 lfs: true。"
            du -sh models || true
            exit 1
          fi
          du -sh models

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: false
          sbom: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
