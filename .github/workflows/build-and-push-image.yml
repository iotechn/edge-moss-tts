name: (Auto) Build and push image

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  REGISTRY: sgccr.ccs.tencentyun.com
  IMAGE_NAME: exm-app/${{ github.event.repository.name }}
  # 模型有更新时可 bump，使缓存失效并重新拉取
  MODELS_CACHE_KEY: v1

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        id: models-cache
        uses: actions/cache@v4
        with:
          path: models
          key: moss-tts-hf-models-${{ env.MODELS_CACHE_KEY }}

      - name: Download models from Hugging Face
        if: steps.models-cache.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --upgrade "huggingface_hub>=0.23.0"
          python << 'PY'
          import os
          from huggingface_hub import snapshot_download

          repos = [
              ("OpenMOSS-Team/MOSS-TTS-Nano-100M-ONNX", "models/MOSS-TTS-Nano-100M-ONNX"),
              ("OpenMOSS-Team/MOSS-Audio-Tokenizer-Nano-ONNX", "models/MOSS-Audio-Tokenizer-Nano-ONNX"),
          ]
          token = os.environ.get("HF_TOKEN") or None
          for repo_id, dest in repos:
              snapshot_download(repo_id=repo_id, local_dir=dest, token=token)
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: false
          sbom: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
